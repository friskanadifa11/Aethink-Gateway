name: AethinkAI Gateway checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check branding/gateway.js && node --check branding/client.js
      - run: docker compose -f compose.yaml config --quiet
